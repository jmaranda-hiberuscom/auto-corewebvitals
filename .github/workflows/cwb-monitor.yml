name: Core Web Vitals Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never run two audits at once: they would compete for CPU and skew the measurements.
concurrency:
  group: cwv-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit Core Web Vitals
        run: npm start
        env:
          URLS_TO_CHECK: ${{ secrets.URLS_TO_CHECK }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          # Prefer repository Variables for thresholds: short numeric secrets like "0.1" get masked
          # as *** everywhere in the logs. Secrets are still accepted; empty means default.
          MAX_LCP: ${{ vars.MAX_LCP || secrets.MAX_LCP }}
          MAX_CLS: ${{ vars.MAX_CLS || secrets.MAX_CLS }}
          MAX_INP: ${{ vars.MAX_INP || secrets.MAX_INP }}
          RUNS_PER_URL: ${{ vars.RUNS_PER_URL || secrets.RUNS_PER_URL }}
