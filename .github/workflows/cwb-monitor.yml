name: CrUX Core Web Vitals Daily Report

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'demo: prueba de publicacion sin CrUX; report: informe real'
        required: true
        default: demo
        type: choice
        options:
          - demo
          - report

permissions:
  contents: read
  issues: write

concurrency:
  group: crux-cwv-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ vars.MONITOR_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run tests
        run: npm test

      - name: Publish daily report in GitHub
        run: ${{ inputs.mode == 'demo' && 'npm run demo' || 'npm start' }}
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          CRUX_ORIGINS: ${{ secrets.CRUX_ORIGINS }}
          CRUX_DEVICES: ${{ vars.CRUX_DEVICES || 'MOBILE,DESKTOP' }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_ISSUE_NUMBER: ${{ vars.REPORT_ISSUE_NUMBER }}
          MAX_LCP: ${{ vars.MAX_LCP || '2500' }}
          MAX_CLS: ${{ vars.MAX_CLS || '0.1' }}
          MAX_INP: ${{ vars.MAX_INP || '200' }}

      - name: Save report files
        if: ${{ always() && hashFiles('reports/*.md', 'reports/*.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: core-web-vitals-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/core-web-vitals.md
            reports/core-web-vitals.json
          if-no-files-found: error
          retention-days: 7
