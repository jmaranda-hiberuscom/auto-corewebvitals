name: Search Console Core Web Vitals Email Monitor

on:
  schedule:
    # Change this cron expression to adjust polling cadence (GitHub Actions minimum is 5 minutes).
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gsc-cwv-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Read Search Console and send email on issues
        run: npm start
        env:
          GSC_PROPERTIES: ${{ secrets.GSC_PROPERTIES }}
          GSC_STORAGE_STATE_BASE64: ${{ secrets.GSC_STORAGE_STATE_BASE64 }}
          GSC_DEVICES: ${{ vars.GSC_DEVICES || 'MOBILE,DESKTOP' }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_API_URL: ${{ vars.EMAIL_API_URL || 'https://api.resend.com/emails' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MAX_LCP: ${{ vars.MAX_LCP || '2500' }}
          MAX_CLS: ${{ vars.MAX_CLS || '0.1' }}
          MAX_INP: ${{ vars.MAX_INP || '200' }}
